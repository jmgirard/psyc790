pagetitle: "Statistical Methods with R"
author-meta: "Jeffrey Girard"

# Title slides identify the material (unit / chapter / lecture), not the offering.
# Semester, course number, and instructor used to appear here and were removed
# when the site became semester-agnostic: whoever teaches from these decks is
# named by the LMS pointing at them, not by the decks themselves.
#
# `attribution` is the small grey line at the bottom of every title slide. A
# future instructor can add their own name to it while leaving the credit intact.
attribution: "Developed by Jeffrey M. Girard"

navbar: false
sidebar: false
page-footer: false

filters:
  - jmgirard/lordicon

format:
  revealjs:
    css: ../../styles.css
    include-after-body: ../../format-outputs.html
    slide-number: true
    show-slide-number: all
    preview-links: false
    progress: true
    history: true
    hash-type: number
    theme: default
    code-block-background: true
    highlight-style: zenburn
    code-link: false
    code-copy: true
    code-line-numbers: false
    controls: true
    code-annotations: hover
