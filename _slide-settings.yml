pagetitle: "Statistical Methods with R"
author-meta: "Jeffrey Girard"

# Title slides identify the material (unit / chapter / lecture), not the offering.
# Semester, course number, and instructor used to appear here and were removed
# when the site became semester-agnostic: whoever teaches from these decks is
# named by the LMS pointing at them, not by the decks themselves.
#
# `course` is the small letterspaced line above the topic on every title slide.
# The topic itself is the headline, since that is the only part that differs from
# deck to deck; the course name is context, not news.
course: "Statistical Methods with R"

# `attribution` is the small grey line at the bottom of every title slide. A
# future instructor can add their own name to it while leaving the credit intact.
attribution: "Developed by Jeffrey M. Girard"

navbar: false
sidebar: false
page-footer: false

filters:
  - jmgirard/lordicon

format:
  revealjs:
    # KaTeX rather than reveal's bundled MathJax 2.7. MathJax 2's HTML-CSS
    # output builds a tall radical by stacking glyph pieces from MathJax_Size4 --
    # a surd, a repeated vertical extender, and a rule -- and the seams between
    # those pieces are visible at deck scale. The SD formula in B/04/a
    # ($\sqrt{\frac{1}{N}\sum...}$) is tall enough to trigger it and renders as a
    # broken column of segments. KaTeX draws the radical as one SVG path, so it
    # is seamless at any size. Everything these decks use (\frac, \sum with
    # limits, \bar, \hat, \sqrt) is well within KaTeX's coverage.
    html-math-method: katex
    css: ../../styles.css
    include-after-body: ../../format-outputs.html
    slide-number: true
    show-slide-number: all
    preview-links: false
    progress: true
    history: true
    hash-type: number
    theme: default
    code-block-background: true
    highlight-style: zenburn
    code-link: false
    code-copy: true
    code-line-numbers: false
    controls: true
    code-annotations: hover
