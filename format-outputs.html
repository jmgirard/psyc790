<script>
document.addEventListener("DOMContentLoaded", function() {
  // 1. Re-classify stderr to warnings and messages and strip empty lines
  document.querySelectorAll('.cell-output-stderr').forEach(function(output) {
    // Strip invisible zero-width spaces Quarto sometimes inserts
    const text = output.textContent.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();

    // Remove completely empty blocks to fix the gaps
    if (text === '') {
      output.remove();
      return;
    }

    if (output.textContent.includes('Warning:')) {
      output.classList.replace('cell-output-stderr', 'cell-output-warning');
    } else {
      output.classList.replace('cell-output-stderr', 'cell-output-message');
    }
  });

  // 2. Physically merge adjacent blocks into one seamless block
  ['.cell-output-message', '.cell-output-warning'].forEach(function(selector) {
    const elements = document.querySelectorAll(selector);
    elements.forEach(function(current) {
      if (!current.parentNode) return; // Skip if it was already merged and removed

      let next = current.nextElementSibling;
      while (next && next.classList.contains(selector.substring(1))) {
        let currentCode = current.querySelector('pre code');
        let nextCode = next.querySelector('pre code');

        if (currentCode && nextCode) {
           // Clean up formatting and append to the primary block
           let appendText = nextCode.innerHTML.replace(/^\n+|\n+$/g, '');
           if (appendText !== '') {
             currentCode.innerHTML += '\n' + appendText;
           }
        }

        let toRemove = next;
        next = next.nextElementSibling;
        toRemove.remove();
      }
    });
  });
});

// 3. Publish reveal's canvas scale as --deck-scale.
//
// Reveal scales the .slides canvas to fit the window, but Quarto's footer lives
// outside that transform, so anything sized in px there ignores the deck size
// entirely. Mirroring the scale onto a custom property lets styles.css keep the
// footer proportional to the slide text (see `.reveal .footer`).
//
// Read off the inline transform rather than Reveal's API on purpose: this file
// is included after the body but before Reveal.initialize() resolves, so there
// is no Reveal object to attach a 'resize' listener to yet. Watching the style
// attribute catches the initial layout and every resize with no ordering
// assumptions -- and no-ops harmlessly on the non-reveal HTML pages, which have
// no .reveal .slides at all.
(function () {
  const slides = document.querySelector(".reveal .slides");
  if (!slides) return;

  function publishScale() {
    const match = /scale\(([\d.]+)\)/.exec(slides.style.transform || "");
    document.documentElement.style.setProperty(
      "--deck-scale",
      match ? match[1] : "1"
    );
  }

  new MutationObserver(publishScale).observe(slides, {
    attributes: true,
    attributeFilter: ["style"],
  });
  publishScale();
})();

// 4. Play each section-divider icon once, when its slide is reached.
//
// Lordicon's own `trigger="in"` cannot do this inside reveal. It works off an
// IntersectionObserver, and reveal keeps the adjacent stacks in the layout
// (display:block, translated out of view) so the observer fires for the wrong
// elements: measured on C/07/a, arriving at "Introduction" played the *fourth*
// section's icon, arriving at "Regression Inference" played the fifth, and the
// icons on the slides actually being shown never played at all.
//
// So the shortcodes carry no `trigger` -- which leaves them static -- and
// playback is driven from reveal's own slide events, which know exactly which
// slide is being entered. `slidechanged` covers navigation; `ready` covers a
// deck opened directly on a divider by URL hash. Both bubble to document, which
// matters because this file runs before Reveal.initialize() resolves and there
// is no Reveal object yet to attach a listener to.
//
// PRINTING NEEDS THE OPPOSITE. The shortcodes ask for `state=in-reveal`, which
// starts the icon blank and draws it in -- right for a divider arriving on
// screen, and wrong for `?print-pdf`, which lays every slide out at once and
// snapshots them. Only the current slide ever gets played, so every other
// divider would print blank. In print mode each icon is therefore seeked to the
// last frame of its state instead: the finished drawing, no animation to wait
// on, and still the state the map asked for. That last part matters for
// `parabola`, whose accent colour only exists in its `morph-squared` state.
(function () {
  var PRINTING = /(\?|&)print-pdf/.test(window.location.search);

  // The player is created asynchronously and its `ready` event does NOT reliably
  // reach a listener on the element -- an earlier version of this waited on it
  // and the print path silently never ran. Poll instead, and give up rather than
  // spin forever if the bundle failed to load.
  function whenReady(el, fn) {
    var tries = 0;
    (function attempt() {
      if (el.playerInstance && el.playerInstance.isReady) { fn(el.playerInstance); return; }
      if (++tries > 120) return;                       // ~10s at 12/s, then stop
      setTimeout(attempt, 80);
    })();
  }

  function playIcons(slide) {
    if (!slide) return;
    slide.querySelectorAll(".section-art lord-icon").forEach(function (el) {
      whenReady(el, function (p) { p.playFromBeginning(); });
    });
  }

  if (PRINTING) {
    // Wait for `pdf-ready`. Reveal rebuilds the slide DOM to lay every slide out
    // on its own page, and seeking before that lands on nodes it then replaces:
    // the icons come back at frame 0 and print blank, which is the bug this
    // whole branch exists to prevent. The timeout is a backstop for a future
    // reveal that stops firing the event.
    var done = false;
    var seek = function () {
      if (done) return;
      done = true;
      document.querySelectorAll(".section-art lord-icon").forEach(function (el) {
        whenReady(el, function (p) { p.goToLastFrame(); });
      });
    };
    document.addEventListener("pdf-ready", seek);
    setTimeout(seek, 3000);
    return;
  }

  document.addEventListener("ready", function (e) { playIcons(e.currentSlide); });
  document.addEventListener("slidechanged", function (e) { playIcons(e.currentSlide); });
})();
</script>
