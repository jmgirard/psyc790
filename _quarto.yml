# No canvas-id here on purpose. This site holds course content only and links
# run one way: a course LMS links in to these pages, and nothing here links back
# out to a particular course site. That is what keeps the site reusable across
# semesters and instructors -- readings, due dates, grading, and the
# chapter-to-week mapping all live in whatever LMS is pointing at it.

project:
  type: website
  # archive/ holds the pre-modernization Fall 2025 source. It is kept for
  # reference but must not be rendered -- without this, quarto picks up every
  # .qmd in it and roughly doubles the build.
  render:
    - "**/*.qmd"
    - "!archive/**"
  resources:
    - "icons/"

execute:
  freeze: auto
  eval: true
  collapse: false

# NOTE: `echo` is deliberately NOT set here. data2's _quarto.yml sets
# `echo: true`, which is right for a coding course but wrong here: it overrides
# revealjs's default of `echo: false` and exposes plumbing code the slides were
# written to hide (C/09/b went from 33 visible code blocks to 57; B/05/b
# doubled, 24 -> 48). Leaving it unset gives each format its own default --
# revealjs hides code unless a chunk opts in with `#| echo: true`, while the
# HTML chapter pages and assignments still show it. See SLIDE-OVERFLOW.md.

website:
  title: "PSYC790"
  navbar:
    background: primary
    search: true
    right:
      - href: schedule.qmd
        icon: list-ul
        text: "Contents"
      - text: "Unit A"
        menu:
          - icon: rocket-takeoff
            text: "Chapter 01: Getting Started"
            href: A/01/index.html
          - icon: code-square
            text: "Chapter 02: Projects and Programming"
            href: A/02/index.html
          - icon: table
            text: "Chapter 03: Data and Exploration"
            href: A/03/index.html
      - text: "Unit B"
        menu:
          - icon: people
            text: "Chapter 04: Sampling and Estimation"
            href: B/04/index.html
          - icon: question-circle
            text: "Chapter 05: Hypothesis Testing"
            href: B/05/index.html
          - icon: bar-chart
            text: "Chapter 06: Group Comparisons"
            href: B/06/index.html
      - text: "Unit C"
        menu:
          - icon: graph-up
            text: "Chapter 07: Regression"
            href: C/07/index.html
          - icon: sliders
            text: "Chapter 08: Moderation"
            href: C/08/index.html
          - icon: clipboard-check
            text: "Chapter 09: Assumptions, Diagnostics, and Nonlinearity"
            href: C/09/index.html
          - icon: rulers
            text: "Chapter 10: Reliability and Measurement Error"
            href: C/10/index.html
          - icon: shuffle
            text: "Chapter 11: Bootstrap and Robust Inference"
            href: C/11/index.html
      - text: "Unit D"
        menu:
          - icon: shield-check
            text: "Chapter 12: Best Practices and Power"
            href: D/12/index.html
          - icon: pen
            text: "Chapter 13: Reporting and Reviewing"
            href: D/13/index.html
  page-footer: "Copyright 2025 &copy; Jeffrey Girard"

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
